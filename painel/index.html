<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Duck | Painel Admin</title>
    
    <link rel="icon" type="image/png" href="/CABECA.png?v=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --preto: #000000;
            --off-white: #f5f5f7;
            --neon-orange: #FF4D00;
            --chumbo-dark: #121212;
            --chumbo-light: #1c1c1e;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-user-select: none !important;
            user-select: none !important;
            font-family: 'Gotham', sans-serif;
        }

        body {
            background-color: var(--preto);
            color: var(--off-white);
            padding: 40px 5%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 77, 0, 0.15);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        h1 { font-size: 1.5rem; letter-spacing: 2px; }
        .highlight { color: var(--neon-orange); }

        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--off-white);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-logout:hover { border-color: var(--neon-orange); color: var(--neon-orange); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
        }

        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .box {
            background: var(--chumbo-dark);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 8px;
        }

        h2 { font-size: 1.1rem; margin-bottom: 20px; letter-spacing: 1px; border-left: 3px solid var(--neon-orange); padding-left: 10px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: rgba(245,245,247,0.6); margin-bottom: 6px; }
        
        input {
            width: 100%; padding: 12px; background: var(--preto);
            border: 1px solid rgba(255,255,255,0.1); color: var(--off-white);
            border-radius: 4px; outline: none;
            -webkit-user-select: text !important; user-select: text !important;
        }
        input:focus { border-color: var(--neon-orange); }

        .btn-primary {
            width: 100%; padding: 14px; background: var(--neon-orange);
            border: none; color: var(--preto); font-weight: bold;
            border-radius: 4px; cursor: pointer; margin-top: 10px;
        }
        .btn-primary:hover { opacity: 0.9; }

        .client-card {
            background: var(--chumbo-light);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .client-card.Pendente { border-left-color: #ffcc00; }
        .client-card.Respondido { border-left-color: #00cc66; }

        .client-info h3 { font-size: 1rem; margin-bottom: 4px; }
        .client-info p { font-size: 0.8rem; color: rgba(245,245,247,0.5); }

        .btn-copy {
            background: rgba(255, 77, 0, 0.1);
            border: 1px solid rgba(255, 77, 0, 0.3);
            color: var(--neon-orange);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-copy:hover { background: var(--neon-orange); color: var(--preto); }

        #link-output {
            margin-top: 15px; padding: 12px; background: rgba(0,204,102,0.1);
            border: 1px solid rgba(0,204,102,0.3); color: #00cc66;
            font-size: 0.8rem; border-radius: 4px; word-break: break-all; display: none;
        }
    </style>
</head>
<body>

    <div id="painel-conteudo">
        <header>
            <h1>PAINEL DE <span class="highlight">CONTROLE</span></h1>
            <button class="btn-logout" id="btn-logout">SAIR DO LAGO</button>
        </header>

        <div class="grid">
            <div class="box">
                <h2>NOVO BRIEFING</h2>
                <div class="form-group">
                    <label>NOME DO CLIENTE</label>
                    <input type="text" id="client-name" placeholder="Ex: Thiago Gil">
                </div>
                <div class="form-group">
                    <label>NOME DO PROJETO</label>
                    <input type="text" id="project-name" placeholder="Ex: Loft Industrial">
                </div>
                <button class="btn-primary" id="btn-generate">GERAR LINK IMERSIVO</button>
                <div id="link-output"></div>
            </div>

            <div class="box">
                <h2>BANDO DE CLIENTES CADASTRADOS</h2>
                <div id="clients-list"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mujzdunuibagimiripcc.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable__VLVH5QkuKF3QBnlJoyUqA_BHFW95hl';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            loadClients();
        }
        
        checkSession();

        function generateToken() {
            return 'duck_' + Math.random().toString(36).substring(2, 11);
        }

        document.getElementById('btn-generate').addEventListener('click', async () => {
            const name = document.getElementById('client-name').value;
            const project = document.getElementById('project-name').value;
            const token = generateToken();

            if (!name || !project) {
                alert('Preencha os campos para gerar o briefing!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('clientes')
                .insert([{ nome_cliente: name, nome_projeto: project, link_token: token, status: 'Pendente' }]);

            if (error) {
                alert('Erro ao salvar no banco: ' + error.message);
            } else {
                const finalLink = `https://www.studioduck.com.br/briefing?id=${token}`;
                const output = document.getElementById('link-output');
                output.innerHTML = `<strong>Link gerado com sucesso:</strong><br>${finalLink}`;
                output.style.display = 'block';
                
                document.getElementById('client-name').value = '';
                document.getElementById('project-name').value = '';
                loadClients();
            }
        });

        async function loadClients() {
            const listDiv = document.getElementById('clients-list');
            listDiv.innerHTML = '<p style="font-size:0.85rem;color:gray;">Carregando bando...</p>';

            try {
                // CORREÇÃO: Agora puxa e ordena pelo ID em ordem decrescente (mais novos primeiro)
                const { data: clientes, error } = await supabaseClient
                    .from('clientes')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    listDiv.innerHTML = `<p style="color:red;">Erro ao carregar dados: ${error.message}</p>`;
                    return;
                }

                if (!clientes || clientes.length === 0) {
                    listDiv.innerHTML = '<p style="font-size:0.85rem;color:gray;">Nenhum cliente gerado ainda.</p>';
                    return;
                }

                listDiv.innerHTML = '';
                clientes.forEach(c => {
                    const card = document.createElement('div');
                    card.className = `client-card ${c.status}`;
                    
                    const urlCompleta = `https://www.studioduck.com.br/briefing?id=${c.link_token}`;

                    card.innerHTML = `
                        <div class="client-info">
                            <h3>${c.nome_cliente}</h3>
                            <p>Projeto: ${c.nome_projeto || 'Não informado'} | Status: <strong>${c.status}</strong></p>
                        </div>
                        <button class="btn-copy" onclick="navigator.clipboard.writeText('${urlCompleta}'); alert('Link copiado!');">Copiar Link</button>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (err) {
                listDiv.innerHTML = '<p style="color:red;">Erro crítico ao renderizar lista.</p>';
            }
        }

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/login';
        });
    </script>
</body>
</html>
