<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Duck | Admin Login</title>
    
    <link rel="icon" type="image/png" href="/CABECA.png?v=1">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --preto: #000000;
            --off-white: #f5f5f7;
            --neon-orange: #FF4D00;
            --chumbo-dark: #121212;
        }

        /* Bloqueio de seleção agressivo que você usa nas outras páginas */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-user-select: none !important;
            user-select: none !important;
            font-family: 'Gotham', sans-serif;
        }

        body {
            background-color: var(--preto);
            color: var(--off-white);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            background: var(--chumbo-dark);
            border: 1px solid rgba(255, 77, 0, 0.15);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            color: var(--off-white);
        }

        .highlight { color: var(--neon-orange); }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: rgba(245, 245, 247, 0.6);
            display: block;
            margin-bottom: 8px;
        }

        /* Inputs liberados apenas para digitação de texto */
        input {
            width: 100%;
            padding: 14px;
            background: var(--preto);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--off-white);
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        input:focus {
            border-color: var(--neon-orange);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--neon-orange);
            border: none;
            color: var(--preto);
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s, transform 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .error-msg {
            color: #ff3333;
            font-size: 0.8rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>STUDIO <span class="highlight">DUCK</span></h1>
        
        <div class="input-group">
            <label>E-MAIL ADM</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>
        
        <div class="input-group">
            <label>SENHA</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="btn-login">ENTRAR NO LAGO</button>
        <div class="error-msg" id="error-box">Usuário ou senha incorretos.</div>
    </div>

    <script>
        <script>
        // --- CONEXÃO COM O SEU PROJETO DO SUPABASE ---
        const SUPABASE_URL = 'https://mujzdunuibagimiripcc.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable__VLVH5QkuKF3QBnlJoyUqA_BHFW95hl';

        // Mudamos o nome aqui de "supabase" para "supabaseClient" para resolver o erro do console
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const btnLogin = document.getElementById('btn-login');
        const errorBox = document.getElementById('error-box');

        // Função de teste com alertas para descobrir onde o código trava
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // TESTE 1: Confirmação visual de clique
            alert('Botão clicado! Tentando conectar com o e-mail: ' + email);

            errorBox.style.display = 'none';

            try {
                // Usando a variável corrigida aqui também
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    // TESTE 2 (Erro): Caso o Supabase recuse as credenciais
                    alert('O Supabase respondeu com ERRO: ' + error.message);
                    errorBox.innerText = "Erro: " + error.message;
                    errorBox.style.display = 'block';
                } else {
                    // TESTE 2 (Sucesso): Caso dê tudo certo
                    alert('LOGIN COM SUCESSO! Redirecionando para o painel...');
                    window.location.href = '/painel';
                }
            } catch (err) {
                // TESTE 3 (Falha crítica): Se a biblioteca quebrar por algum motivo
                alert('Erro crítico de código: ' + err.message);
            }
        }

        btnLogin.addEventListener('click', handleLogin);

        // Permite logar apertando o botão "Enter" do teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
